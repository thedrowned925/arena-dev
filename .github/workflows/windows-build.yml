name: Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Package EXE
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: arena-dev-windows
          path: dist/*.exe
          if-no-files-found: error
